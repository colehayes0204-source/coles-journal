<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' gon: journal-media: data:; media-src 'self' gon: journal-media: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com">
<title>Cole's Journal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="assets/gon-portrait.jpg" alt=""><div><b>Cole's Journal</b><span class="muted" id="sideAcct">All accounts</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button type="button" class="acct-btn" id="acctBtn">All accounts</button>
      <div class="muted tiny" id="sideVer"></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="top">
      <button type="button" class="search" id="searchBtn"><span>Search</span><kbd>/</kbd></button>
      <span class="grow"></span>
      <span class="pill" id="topSession">Session</span>
      <button type="button" class="icon-btn" id="themeBtn" title="Light or dark">◐</button>
      <button type="button" class="btn primary" id="newTradeBtn">New trade <kbd>N</kbd></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="modal" id="modal" hidden></div>
<div class="palette" id="palette" hidden>
  <input id="paletteQ" placeholder="Jump to a page or action" autocomplete="off">
  <div id="paletteList"></div>
</div>
<div class="toast" id="toast"></div>
<div class="update-pill" id="updatePill" hidden><span>Update ready</span><button type="button" class="btn primary sm" id="updateRestart">Restart</button></div>
<script src="../journal-math.js"></script>
<script src="../media-path.js"></script>
<script src="../sessions.js"></script>
<script src="app.js"></script>
</body>
</html>
